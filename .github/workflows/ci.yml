name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}-${{ hashFiles('pyproject.toml') }}
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  vm-smoke-3_11:
  # Production VM (Debian Bookworm) runs 3.11. Full pre-commit on 3.11 fails on
  # 3.12-only f-string syntax elsewhere; this job checks parse + deps on 3.11 only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime deps
        run: pip install -r requirements.txt
      - name: VM deploy smoke test
        run: python scripts/verify_vm_deploy.py
